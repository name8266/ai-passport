name: PassportNav
options:
  bundleIdPrefix: com.passportnav
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PassportNav:
    type: application
    platform: iOS
    sources:
      - path: PassportNav
    info:
      path: PassportNav/Info.plist
      properties:
        CFBundleDisplayName: Passport Nav
        UILaunchScreen: {}
        NSLocationWhenInUseUsageDescription: "用于导航定位、速度和转向信息计算。"
        NSLocationAlwaysAndWhenInUseUsageDescription: "导航期间即使屏幕锁定也需要连续定位。"
        NSBluetoothAlwaysUsageDescription: "通过蓝牙将导航数据发送至 Passport。"
        UIBackgroundModes:
          - location
          - bluetooth-central
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.passportnav.companion
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
