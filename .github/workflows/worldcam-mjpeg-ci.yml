name: WorldCam MJPEG experiment

on:
  push:
    branches:
      - "feature/worldcam-mjpeg"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worldcam-mjpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Host tests + ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install verified actionlint
        run: |
          actionlint_bin="$(./tools/install-actionlint.sh "$RUNNER_TEMP/actionlint")"
          echo "ACTIONLINT_BIN=${actionlint_bin}" >> "$GITHUB_ENV"

      - name: Install WorldCam maintenance dependencies
        run: |
          python3 -m venv .worldcam-venv
          .worldcam-venv/bin/pip install -r gateway/requirements.txt
          echo "$GITHUB_WORKSPACE/.worldcam-venv/bin" >> "$GITHUB_PATH"

      - name: Run repository and MJPEG host tests
        run: |
          python3 tools/check_repo.py
          test_dir="$(mktemp -d)"
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tests/test_worldcam_protocol.c main/worldcam_protocol.c \
            -o "$test_dir/test_worldcam_protocol"
          "$test_dir/test_worldcam_protocol"
          cc -std=c11 -Wall -Wextra -Werror -Imain \
            tests/test_worldcam_mjpeg.c main/worldcam_mjpeg.c \
            -o "$test_dir/test_worldcam_mjpeg"
          "$test_dir/test_worldcam_mjpeg"
          python3 tools/generate_worldcam_catalog.py --check
          python3 tests/test_worldcam_catalog.py
          rm -rf "$test_dir"

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: mjpeg-ccache-${{ github.sha }}
          restore-keys: |
            mjpeg-ccache-

      - name: Build and verify ESP32-C3 firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Upload experimental firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: passport-worldcam-mjpeg-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7

      - name: Publish flashable firmware on this branch
        run: |
          mkdir -p firmware/worldcam-mjpeg
          cp build/FoloToy-AI-Passport-full.bin firmware/worldcam-mjpeg/FoloToy-AI-Passport-worldcam-real-live.bin
          sha256sum firmware/worldcam-mjpeg/FoloToy-AI-Passport-worldcam-real-live.bin             | awk '{print $1 "  FoloToy-AI-Passport-worldcam-real-live.bin"}'             > firmware/worldcam-mjpeg/SHA256SUMS.txt
          cat > firmware/worldcam-mjpeg/README.md <<'EOF'
          # WorldCam real-live firmware

          Branch: `feature/worldcam-mjpeg`

          Firmware: `FoloToy-AI-Passport-worldcam-real-live.bin`

          This is the merged ESP32-C3 image. Flash it at offset `0x0`.

          It autoplays the curated public MJPEG live-source list after Wi-Fi connects,
          supports UP/DOWN source switching, OK reconnect, automatic source failover,
          and preserves the original WorldCam snapshot catalogue.

          The file is generated by the branch CI from the exact branch source.
          Verify it against `SHA256SUMS.txt` before flashing.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f firmware/worldcam-mjpeg/FoloToy-AI-Passport-worldcam-real-live.bin             firmware/worldcam-mjpeg/SHA256SUMS.txt             firmware/worldcam-mjpeg/README.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish WorldCam real-live firmware [skip ci]"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
