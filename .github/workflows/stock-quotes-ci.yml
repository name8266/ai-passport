name: A-share stock board
on:
  push:
    branches: ["feature/stock-quotes"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stock-quotes-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install host maintenance dependencies
        run: |
          python3 -m venv .worldcam-venv
          .worldcam-venv/bin/pip install -r gateway/requirements.txt
          echo "$GITHUB_WORKSPACE/.worldcam-venv/bin" >> "$GITHUB_PATH"
      - name: Host checks and tests
        run: ./tools/validate.sh --static
      - name: Build and verify firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: ./tools/validate.sh --firmware
      - name: Downloadable merged firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: FoloToy-AI-Passport-stock-quotes-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7
