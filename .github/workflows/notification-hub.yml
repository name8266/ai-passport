name: Notification Hub
on:
  push:
    branches: [feature/notification-hub, codex/notification-public-beta, 'release/notification-hub-public-*']
    paths:
      - "apps/notification-hub/**"
      - ".github/workflows/notification-hub.yml"
      - "components/bsp/**"
      - "tools/validate.sh"
  pull_request:
    paths:
      - "apps/notification-hub/**"
      - ".github/workflows/notification-hub.yml"
      - "tools/validate.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notification-hub-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Parser tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            apps/notification-hub/tests/test_hub_protocol.c \
            apps/notification-hub/firmware/main/hub_protocol.c \
            -o /tmp/hub_protocol
          /tmp/hub_protocol
      - name: Full archive, UI, protocol, font and firmware host regressions
        run: ./tools/validate.sh --host
      - name: Public default-state and customer-delivery source checks
        run: python3 apps/notification-hub/tests/test_public_release.py

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: ASan and UBSan on notification state, journal, input parsing and ANCS
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/passport-sanitizers
          flags=(-std=c11 -D_POSIX_C_SOURCE=200809L -O1 -g -Wall -Wextra -Werror
                 -fno-omit-frame-pointer -fsanitize=address,undefined)
          base="apps/notification-hub"
          inc=(-I"$base/tests/stubs" -I"$base/firmware/main")
          clang "${flags[@]}" "${inc[@]}" "$base/tests/test_hub_archive.c" \
            "$base/firmware/main/hub_protocol.c" -lm -o /tmp/passport-sanitizers/archive
          clang "${flags[@]}" "${inc[@]}" "$base/tests/test_hub_catalog.c" \
            -o /tmp/passport-sanitizers/catalog
          clang "${flags[@]}" "${inc[@]}" "$base/tests/test_hub_form.c" \
            "$base/firmware/main/hub_form.c" "$base/firmware/main/hub_alert.c" \
            "$base/firmware/main/hub_web_auth.c" -lm -o /tmp/passport-sanitizers/forms
          clang "${flags[@]}" "${inc[@]}" "$base/tests/test_hub_protocol.c" \
            "$base/firmware/main/hub_protocol.c" -o /tmp/passport-sanitizers/protocol
          clang "${flags[@]}" "${inc[@]}" "$base/tests/test_hub_debounce.c" \
            -o /tmp/passport-sanitizers/debounce
          for suite in archive catalog forms protocol debounce; do
            echo "Sanitizer suite: ${suite}"
            ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 \
              UBSAN_OPTIONS=halt_on_error=1 \
              "/tmp/passport-sanitizers/${suite}"
          done


  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build on ESP-IDF 5.5.3
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: |
            cd apps/notification-hub/firmware
            idf.py build
            # Verify the generated effective Kconfig, not just sdkconfig.defaults.
            grep -qx "CONFIG_WL_SECTOR_SIZE_512=y" sdkconfig
            grep -qx "CONFIG_WL_SECTOR_MODE_SAFE=y" sdkconfig
            grep -qx "CONFIG_BT_NIMBLE_ENABLED=y" sdkconfig
            grep -qx "CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1" sdkconfig
            echo "NimBLE memory profile: verified"
            echo "Wear-levelling safety mode: verified"
            idf.py merge-bin -o notification-hub-full.bin --format raw
      - name: Prepare customer-grade dual firmware package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          cp apps/notification-hub/firmware/build/notification-hub-full.bin \
            "release/Passport通知中心-Public1.0.0RC3-全新安装.bin"
          cp apps/notification-hub/firmware/build/FoloToy-AI-Passport.bin \
            "release/Passport通知中心-Public1.0.0RC3-应用升级.bin"
          cp "apps/notification-hub/客户安装说明.md" "release/客户安装说明.md"
          cp "apps/notification-hub/RC2内存验收.md" "release/RC2内存验收.md"
          cp "apps/notification-hub/RC3摘要增量验收.md" "release/RC3摘要增量验收.md"
          (cd release && sha256sum -- *bin > "校验值-SHA256.txt")
          python3 apps/notification-hub/tests/test_public_release.py release
          cat "release/校验值-SHA256.txt"
      - name: Upload public customer installation package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Passport通知中心-Public1.0.0RC3
          path: release/
          if-no-files-found: error
          retention-days: 30
