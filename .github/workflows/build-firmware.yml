name: Build firmware

on:
  push:
    branches:
      - "feature/worldcam"
      - "worldcam2"
    tags:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact_name.outputs.name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ccache-${{ github.ref_type }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ github.ref_type }}-${{ github.ref_name }}-
            ccache-

      - name: Verify live snapshots for Passport
        if: github.ref_name == 'worldcam2'
        run: |
          python3 -m venv .worldcam-venv
          .worldcam-venv/bin/pip install -r gateway/requirements.txt
          .worldcam-venv/bin/python tools/audit_worldcam_sources.py \
            --workers 8 --timeout 6 --attempts 2 --max-ms 4500 --min-passed 80
          .worldcam-venv/bin/python tools/generate_worldcam_catalog.py

      - name: Validate repository and host tests
        if: github.ref_name == 'worldcam2'
        run: |
          export PATH="$PWD/.worldcam-venv/bin:$PATH"
          ./tools/validate.sh --static

      - name: Commit verified source catalogue
        if: github.ref_name == 'worldcam2'
        run: |
          if ! git diff --quiet -- gateway/cameras.json gateway/capital-coverage.json gateway/source-audit.json main/worldcam_catalog.c; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gateway/cameras.json gateway/capital-coverage.json gateway/source-audit.json main/worldcam_catalog.c
            git commit -m "chore(worldcam): refresh verified snapshots [skip ci]"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi

      - name: Upload source verification report
        if: github.ref_name == 'worldcam2'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: worldcam-source-audit-${{ github.run_id }}
          path: gateway/source-audit.json
          if-no-files-found: error
          retention-days: 7

      - name: Build firmware (ESP-IDF 5.5.3 / esp32c3)
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Set artifact name
        id: artifact_name
        run: echo "name=passport-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ needs.build.outputs.artifact_name }}
          path: release

      - name: Create release (tag push)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }}"
          files: release/FoloToy-AI-Passport-full.bin
          fail_on_unmatched_files: true
